map $http_origin $cors_origin {
    default "";
    "https://goraekorean.site" "https://goraekorean.site";
    "https://www.goraekorean.site" "https://www.goraekorean.site";
    "https://dev-api.goraekorean.site" "https://dev-api.goraekorean.site";
}

server {
    listen 80;
    server_name dev-api.goraekorean.site;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name dev-api.goraekorean.site;

    ssl_certificate /etc/letsencrypt/live/dev-api.goraekorean.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.goraekorean.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://docker;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Disposition' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin';
            add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Disposition';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' '0';
            return 204;
        }
    }
}