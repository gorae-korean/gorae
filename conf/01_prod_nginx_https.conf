map $http_origin $cors_origin {
    default "";
    "https://goraekorean.site" "https://goraekorean.site";
    "https://www.goraekorean.site" "https://www.goraekorean.site";
    "https://api.goraekorean.site" "https://api.goraekorean.site";
}

server {
    listen 80;
    server_name api.goraekorean.site; # 프로덕션 도메인 추가

    if ($http_x_forwarded_proto != 'https') {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://docker;
        proxy_http_version 1.1;

        # 프록시 헤더 (백엔드 애플리케이션에 중요한 정보 제공)
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 헤더 (API에 중요)
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Disposition' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # OPTIONS 요청 특별 처리
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With, Accept, Origin';
            add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Disposition';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' '0';
            return 204;
        }
    }
}