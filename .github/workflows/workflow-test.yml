name: Deploy to test instance

on:
  push:
    branches:
      - develop
      - develop/**
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, 'readme.md')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Create ECR repository if not exists (TEST)
        run: |
          aws ecr describe-repositories --repository-names ${{ secrets.ECR_REPOSITORY_NAME_TEST }} || \
          aws ecr create-repository --repository-name ${{ secrets.ECR_REPOSITORY_NAME_TEST }}

      - name: Build, tag, and push image to Amazon ECR (TEST)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME_TEST }}
          IMAGE_TAG: test-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Generate Dockerrun.aws.json
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME_TEST }}
          IMAGE_TAG: test-${{ github.sha }}
        run: |
          cat > Dockerrun.aws.json << EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": 8080,
                "HostPort": 8080
              }
            ],
            "Volumes": [],
            "Logging": "/var/log/app"
          }
          EOF

      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp Dockerrun.aws.json deploy/
          
          # AL2023: .platform 디렉터리 사용
          mkdir -p deploy/.platform/nginx/conf.d
          mkdir -p deploy/.platform/hooks/postdeploy
          
          # conf 파일을 그대로 배치
          cp conf/02_test_nginx_https.conf deploy/.platform/nginx/conf.d/https_redirect.conf
          
          # 배포 후 nginx 테스트 및 리로드 훅
          cat > deploy/.platform/hooks/postdeploy/01-reload-nginx.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          # 기본 사이트가 충돌을 유발하면 비활성화(존재할 경우)
          if [ -f /etc/nginx/sites-enabled/default ]; then
            rm -f /etc/nginx/sites-enabled/default || true
          fi
          nginx -t
          systemctl reload nginx
          EOF
          chmod +x deploy/.platform/hooks/postdeploy/01-reload-nginx.sh
          
          # 패키징
          cd deploy && zip -r ../deploy.zip .

      - name: Deploy to Elastic Beanstalk (TEST)
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME_TEST }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME_TEST }}
          version_label: "gorae-test-${{ github.sha }}"
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip
          wait_for_environment_recovery: 300
          use_existing_version_if_available: true

      - name: Update environment variables (TEST)
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ secrets.EB_APPLICATION_NAME_TEST }} \
            --environment-name ${{ secrets.EB_ENVIRONMENT_NAME_TEST }} \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SPRING_PROFILES_ACTIVE,Value=test \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SPRING_BASEURL,Value=https://dev-api.goraekorean.site \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SPRING_DATASOURCE_URL,Value=${{ secrets.DB_URL_TEST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SPRING_DATASOURCE_USERNAME,Value=${{ secrets.DB_USERNAME_TEST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SPRING_DATASOURCE_PASSWORD,Value=${{ secrets.DB_PASSWORD_TEST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=GOOGLE_CLIENT_ID,Value=${{ secrets.GOOGLE_CLIENT_ID_TEST }} \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=GOOGLE_CLIENT_SECRET,Value=${{ secrets.GOOGLE_CLIENT_SECRET_TEST }}